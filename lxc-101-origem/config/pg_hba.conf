# ==============================================================================
# pg_hba.conf - Controle de Acesso e Permissões de Replicação
# PoC de Auditoria Contínua - Nó LXC 101 (Origem Transacional)
# ==============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Conexões locais do sistema operacional (Unix domain socket)
local   all             all                                     trust

# Conexões locais IPv4 e IPv6
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Permissão para a sub-rede privada Proxmox (LXC 101, 102, 103)
host    all             all             192.168.1.0/24          scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256

# Permissão explícita de REPLICAÇÃO para o usuário do Debezium CDC
host    replication     debezium        192.168.1.0/24          scram-sha-256
host    replication     debezium        10.0.0.0/8              scram-sha-256
host    replication     debezium        172.16.0.0/12           scram-sha-256
host    replication     all             all                     scram-sha-256

# Fallback para contêineres e testes de rede
host    all             all             all                     scram-sha-256
