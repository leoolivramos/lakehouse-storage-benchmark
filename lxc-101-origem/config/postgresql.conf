# ==============================================================================
# postgresql.conf - Configuração Otimizada para Captura CDC (Debezium)
# PoC de Auditoria Contínua - Nó LXC 101 (Origem Transacional)
# ==============================================================================

# --- Conexões e Rede ---
listen_addresses = '*'
port = 5432
max_connections = 100

# --- Memória e Recursos (Adequado para nó de 8GB RAM) ---
shared_buffers = 2GB
work_mem = 32MB
maintenance_work_mem = 256MB
effective_cache_size = 6GB

# ==============================================================================
# Parâmetros Essenciais de Replicação Lógica e CDC
# (Conforme detalhado no Capítulo de Desenvolvimento da PoC)
# ==============================================================================

# Habilita a decodificação lógica do Write-Ahead Log (WAL)
wal_level = logical

# Define o número máximo de processos de replicação simultâneos
max_wal_senders = 4

# Define o número máximo de slots de replicação lógica
max_replication_slots = 4

# --- Gerenciamento e Retenção do WAL ---
wal_keep_size = 1024MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# --- Logging e Auditoria ---
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'
