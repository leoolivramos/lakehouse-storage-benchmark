services:
  # ----------------------------------------------------------------------------
  # 1. Silo: Object Storage S3-Compatible
  # ----------------------------------------------------------------------------
  silo:
    image: ${SILO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z}
    container_name: silo-lakehouse
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_lakehouse}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lakehouse_secret_key}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  silo-init:
    image: ${SILO_MC_IMAGE:-docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    container_name: silo-init-buckets
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set silo http://silo:9000 ${MINIO_ROOT_USER:-admin_lakehouse} ${MINIO_ROOT_PASSWORD:-lakehouse_secret_key};
      /usr/bin/mc mb --ignore-existing silo/${MINIO_BUCKET_NAME:-lakehouse-audit};
      /usr/bin/mc anonymous set download silo/${MINIO_BUCKET_NAME:-lakehouse-audit};
      echo 'Bucket ${MINIO_BUCKET_NAME:-lakehouse-audit} configurado com sucesso.';
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # 2. Apache Hadoop HDFS (NameNode & DataNode)
  # ----------------------------------------------------------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=lakehouse-cluster
      - HDFS_CONF_dfs_permissions=false
      - HDFS_CONF_dfs_replication=1
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-datanode
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - HDFS_CONF_dfs_permissions=false
      - HDFS_CONF_dfs_replication=1
    volumes:
      - datanode_data:/hadoop/dfs/data

volumes:
  # Nome legado mantido para reutilizar dados existentes na migração para Silo.
  minio_data:
  namenode_data:
  datanode_data:
